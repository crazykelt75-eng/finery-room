<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b1226"/>
      <stop offset="100%" stop-color="#0a090c"/>
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a7e0"/>
      <stop offset="50%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="url(#purpleGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#9b59b6" stroke-width="0.8" stroke-dasharray="1 1"/>
  
  <!-- Stylized FR monogram -->
  <text x="36" y="58" font-family="'Playfair Display', 'Bodoni MT', serif" font-size="34" font-weight="700" fill="url(#purpleGrad)" text-anchor="middle">F</text>
  <text x="58" y="58" font-family="'Playfair Display', 'Bodoni MT', serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">R</text>
  
  <!-- Sweeping lash curve from R -->
  <path d="M 64 56 Q 78 58 84 46" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Lash hairs -->
  <path d="M 72 57 L 76 50 M 75 56 L 80 49 M 78 54 L 84 48 M 81 52 L 86 46" stroke="#c9a7e0" stroke-width="1" stroke-linecap="round"/>

  <!-- Fleur-de-lis tiny accent -->
  <path d="M 50 72 C 48 70 45 71 45 74 C 45 76 48 77 50 80 C 52 77 55 76 55 74 C 55 71 52 70 50 72 Z" fill="url(#purpleGrad)"/>
</svg>
